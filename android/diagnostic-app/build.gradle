plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfsmw.diagnostics'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nfsmw.diagnostics'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-diagnostic'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native-diagnostics/CMakeLists.txt')
            version '3.30.5'
        }
    }

    ndkVersion '28.2.13676358'
}
