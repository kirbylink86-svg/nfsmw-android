name: Android integration checks

on:
  push:
    branches: [adreno610-30fps]
  pull_request:
    branches: [adreno610-30fps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-scaffold:
    name: Validate Android / Gradle scaffold (no game recompilation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore pinned SDL3 Android Java project
        shell: bash
        run: |
          set -euo pipefail
          destination="sdk/thirdparty/sdl3"
          mkdir -p "$(dirname "$destination")"
          git clone --filter=blob:none --no-checkout https://github.com/libsdl-org/SDL.git "$destination"
          git -C "$destination" fetch --depth=1 origin 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          git -C "$destination" checkout --detach 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          test -f "$destination/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java"

      - name: Validate Gradle project configuration
        working-directory: android
        run: ./gradlew --no-daemon help

      - name: Report scope
        run: |
          echo "Android Gradle configuration and SDLActivity source are present."
          echo "This workflow intentionally does not invoke CMake, ReXGlue code generation, or package a game APK."
