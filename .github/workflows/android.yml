name: Android integration checks

on:
  push:
    branches: [adreno610-30fps]
  pull_request:
    branches: [adreno610-30fps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-scaffold:
    name: Validate Android / Gradle scaffold (no game recompilation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.30.5'

      - name: Restore pinned SDL3 Android Java project
        shell: bash
        run: |
          set -euo pipefail
          destination="sdk/thirdparty/sdl3"
          mkdir -p "$(dirname "$destination")"
          git clone --filter=blob:none --no-checkout https://github.com/libsdl-org/SDL.git "$destination"
          git -C "$destination" fetch --depth=1 origin 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          git -C "$destination" checkout --detach 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          test -f "$destination/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java"

      - name: Compile Android Java and resources (without native game build)
        working-directory: android
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac

      - name: Configure isolated Android ARM64 native diagnostics
        run: |
          set -euo pipefail
          cmake -S android/native-diagnostics -B out/native-diagnostics \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build isolated Android ARM64 native diagnostics
        run: cmake --build out/native-diagnostics --parallel 2

      - name: Upload native diagnostics library
        uses: actions/upload-artifact@v4
        with:
          name: android-native-diagnostics-arm64
          path: out/native-diagnostics/libnfsmw_native_diagnostics.so
          if-no-files-found: error

      - name: Assemble standalone native diagnostics APK
        working-directory: android
        run: ./gradlew --no-daemon :diagnostic-app:assembleDebug

      - name: Upload standalone native diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-native-diagnostics-apk
          path: android/diagnostic-app/build/outputs/apk/debug/diagnostic-app-debug.apk
          if-no-files-found: error

      - name: Report scope
        run: |
          echo "Android Java/resources and isolated ARM64 native diagnostics compiled successfully."
          echo "The diagnostic library checks Vulkan loader linkage; it is not the game and does not produce a playable APK."
